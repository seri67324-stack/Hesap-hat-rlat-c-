name: APK Derle

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Birim testlerini çalıştır
        run: gradle testDebugUnitTest --console=plain

      - name: Debug APK derle
        run: gradle assembleDebug --console=plain

      - name: Debug APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: HarcamaTakip-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Keystore hazırla
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > harcama-release.jks
          {
            echo "storeFile=harcama-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Release APK derle
        if: env.KEYSTORE_BASE64 != ''
        run: gradle assembleRelease --stacktrace

      - name: Release APK yükle
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: HarcamaTakip-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Releases'a ekle (imzalı)
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk

      - name: Releases'a ekle (debug)
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 == ''
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
